<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp Bulk Sender</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #0f1117;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: #1a1d27;
      border: 1px solid #2a2d3a;
      border-radius: 16px;
      padding: 36px 32px;
      width: 100%;
      max-width: 460px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }

    .logo-icon {
      width: 42px; height: 42px;
      background: #25D366;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
    }

    .logo h1 { font-size: 20px; font-weight: 700; color: #fff; }
    .logo p { font-size: 12px; color: #888; margin-top: 2px; }

    .status-bar {
      background: #12141c;
      border: 1px solid #2a2d3a;
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
    }

    .dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot.idle        { background: #555; }
    .dot.starting    { background: #f59e0b; animation: pulse 1s infinite; }
    .dot.qr          { background: #3b82f6; animation: pulse 1s infinite; }
    .dot.ready       { background: #25D366; }
    .dot.disconnected{ background: #ef4444; }

    @keyframes pulse {
      0%,100% { opacity:1; } 50% { opacity:0.3; }
    }

    .qr-container {
      text-align: center;
      margin-bottom: 24px;
      display: none;
    }
    .qr-container p { font-size: 13px; color: #888; margin-bottom: 12px; }
    #qrImg {
      width: 220px; height: 220px;
      border-radius: 12px;
      border: 4px solid #25D366;
    }

    .btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
      margin-bottom: 12px;
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-green { background: #25D366; color: #fff; }
    .btn-blue  { background: #3b82f6; color: #fff; }

    .form-section { display: none; }

    .field { margin-bottom: 16px; }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    input, textarea {
      width: 100%;
      background: #12141c;
      border: 1px solid #2a2d3a;
      border-radius: 8px;
      padding: 11px 14px;
      color: #e0e0e0;
      font-size: 14px;
      outline: none;
      font-family: inherit;
    }
    input:focus, textarea:focus { border-color: #25D366; }
    textarea { resize: vertical; min-height: 90px; }

    .row { display: flex; gap: 12px; }
    .row .field { flex: 1; }

    .result-box {
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 14px;
      margin-top: 8px;
      display: none;
      font-weight: 600;
    }
    .result-box.success { background: #0d2e1a; border: 1px solid #25D366; color: #25D366; }
    .result-box.error   { background: #2e0d0d; border: 1px solid #ef4444; color: #ef4444; }

    hr { border: none; border-top: 1px solid #2a2d3a; margin: 20px 0; }
  </style>
</head>
<body>
<div class="card">

  <div class="logo">
    <div class="logo-icon">💬</div>
    <div>
      <h1>WA Bulk Sender</h1>
      <p>WhatsApp automation tool</p>
    </div>
  </div>

  <div class="status-bar">
    <div class="dot idle" id="dot"></div>
    <span id="statusText">Not connected</span>
  </div>

  <div class="qr-container" id="qrContainer">
    <p>Open WhatsApp → Linked Devices → Link a Device</p>
    <img id="qrImg" alt="QR Code">
  </div>

  <button class="btn btn-green" id="startBtn" onclick="start()">Connect WhatsApp</button>

  <div class="form-section" id="formSection">
    <hr>
    <div class="field">
      <label>Phone Number (with country code)</label>
      <input id="number" type="tel" placeholder="919876543210">
    </div>
    <div class="field">
      <label>Message</label>
      <textarea id="message" placeholder="Type your message..."></textarea>
    </div>
    <div class="row">
      <div class="field">
        <label>Quantity</label>
        <input id="qty" type="number" min="1" max="100" value="1">
      </div>
    </div>
    <button class="btn btn-blue" id="sendBtn" onclick="send()">Send Messages</button>
    <div class="result-box" id="resultBox"></div>
  </div>

</div>

<script>
let poll;

function start() {
  fetch("/start-whatsapp");
  document.getElementById("statusText").innerText = "Initializing...";
  document.getElementById("dot").className = "dot starting";
  document.getElementById("startBtn").disabled = true;
  poll = setInterval(checkStatus, 2000);
}

async function checkStatus() {
  const res = await fetch("/status");
  const data = await res.json();
  const dot = document.getElementById("dot");
  const statusText = document.getElementById("statusText");

  if (data.status === "qr") {
    dot.className = "dot qr";
    statusText.innerText = "Scan QR Code";
    document.getElementById("qrImg").src = data.qrCode;
    document.getElementById("qrContainer").style.display = "block";
  }

  if (data.status === "ready") {
    clearInterval(poll);
    dot.className = "dot ready";
    statusText.innerText = "Connected ✅";
    document.getElementById("qrContainer").style.display = "none";
    document.getElementById("startBtn").style.display = "none";
    document.getElementById("formSection").style.display = "block";
  }

  if (data.status === "disconnected") {
    location.reload();
  }
}

async function send() {
  const number = document.getElementById("number").value.trim();
  const message = document.getElementById("message").value.trim();
  const qty = document.getElementById("qty").value;
  const sendBtn = document.getElementById("sendBtn");
  const resultBox = document.getElementById("resultBox");

  if (!number || !message || !qty) {
    resultBox.className = "result-box error";
    resultBox.innerText = "❌ Please fill all fields";
    resultBox.style.display = "block";
    return;
  }

  sendBtn.disabled = true;
  sendBtn.innerText = "Sending...";
  resultBox.style.display = "none";

  const res = await fetch("/send-message", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ number, message, quantity: qty })
  });

  const data = await res.json();
  sendBtn.disabled = false;
  sendBtn.innerText = "Send Messages";

  if (data.success) {
    resultBox.className = "result-box success";
    resultBox.innerText = "✅ Messages sent successfully!";
  } else {
    resultBox.className = "result-box error";
    resultBox.innerText = "❌ " + data.error;
  }
  resultBox.style.display = "block";
}
</script>
</body>
</html>
