<!DOCTYPE html>
<html>
<head>
  <title>WhatsApp Sender</title>
</head>
<body style="text-align:center;font-family:Arial">

<h2>WhatsApp Web JS</h2>

<button id="startBtn" onclick="start()">Start WhatsApp</button>
<div id="statusText" style="margin:20px"></div>
<img id="qrImg" style="width:250px;display:none">

<button id="sendBtn" onclick="openForm()">Send Message</button>

<div id="form" style="display:none">
  <input id="number" placeholder="91XXXXXXXXXX"><br><br>
  <textarea id="message" placeholder="Message"></textarea><br><br>
  <input id="qty" type="number" placeholder="Quantity"><br><br>
  <button onclick="send()">Send</button>
</div>

<button id="againBtn" style="display:none" onclick="openForm()">Send Again</button>

<script>
let poll;

function start(){
  fetch("/start-whatsapp");
  statusText.innerText = "Initializing...";
  poll = setInterval(checkStatus, 2000);
}

async function checkStatus(){
  const res = await fetch("/status");
  const data = await res.json();

  if(data.status === "qr"){
    qrImg.src = data.qrCode;
    qrImg.style.display = "block";
    statusText.innerText = "Scan QR Code";
  }

  if(data.status === "ready"){
    clearInterval(poll);
    qrImg.style.display = "none";
    startBtn.style.display = "none";
    sendBtn.style.display = "inline-block";
    statusText.innerText = "Connected Successfully ✅";
  }

  if(data.status === "disconnected"){
    location.reload();
  }
}

function openForm(){
  form.style.display = "block";
  sendBtn.style.display = "none";
  againBtn.style.display = "none";
}

async function send(){
  statusText.innerText = "Sending...";
  const res = await fetch("/send-message", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      number: number.value,
      message: message.value,
      quantity: qty.value
    })
  });

  const data = await res.json();
  if(data.success){
    form.style.display = "none";
    againBtn.style.display = "inline-block";
    statusText.innerText = "Message Sent Successfully ✅";
  } else {
    statusText.innerText = data.error;
  }
}
</script>

</body>
</html>
